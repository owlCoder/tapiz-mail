<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  .icon {
    width: 512px;
    height: 512px;
    position: relative;
    background: linear-gradient(to bottom right, #1EB5D4 0%, #0E7088 100%);
    overflow: hidden;
  }
  /* Matches ic_launcher_background.xml's radial gradient exactly:
     centerX=34/108=31.48%, centerY=30/108=27.78%, radius=86/108=79.63% of 512px=407.6px,
     stops 0%/#5CFFFFFF(36% alpha), 55%/#1FFFFFFF(12% alpha), 100%/transparent. */
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle 407.6px at 31.48% 27.78%,
      rgba(255,255,255,0.36) 0%,
      rgba(255,255,255,0.12) 55%,
      rgba(255,255,255,0) 100%
    );
  }
  svg { position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
  <div class="icon">
    <div class="glow"></div>
    <svg width="512" height="512" viewBox="0 0 108 108">
      <path d="M39,37 H69 A7,7 0 0 1 76,44 V63 A7,7 0 0 1 69,70 H39 A7,7 0 0 1 32,63 V44 A7,7 0 0 1 39,37 Z"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M34.5,41 L54,56 L73.5,41"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
</body>
</html>
