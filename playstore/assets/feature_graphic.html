<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Segoe UI";
  }
  html, body { margin: 0; padding: 0; }
  .canvas {
    width: 1024px;
    height: 500px;
    position: relative;
    background: linear-gradient(to bottom right, #1EB5D4 0%, #0E7088 100%);
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  /* Same radial recipe as ic_launcher_background.xml (centerX 31.48%, centerY 27.78% of
     the icon chip's own box), reused here anchored to the icon chip position instead of
     the full canvas so the glow reads as "coming from the icon", consistent with the
     launcher icon's glow being anchored top-left of its own square. */
  .glow {
    position: absolute;
    top: -110px;
    left: -60px;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.10) 55%, rgba(255,255,255,0) 100%);
  }
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.14) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    opacity: 0.5;
  }
  .content {
    position: relative;
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 72px;
    box-sizing: border-box;
  }
  .icon-chip {
    width: 220px;
    height: 220px;
    border-radius: 48px;
    background: rgba(255,255,255,0.14);
    border: 1.5px solid rgba(255,255,255,0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 24px 60px rgba(3, 30, 40, 0.35);
  }
  .text {
    margin-left: 56px;
  }
  .title {
    color: #FFFFFF;
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.05;
  }
  .subtitle {
    color: rgba(255,255,255,0.88);
    font-size: 30px;
    font-weight: 500;
    margin: 18px 0 0 0;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="dots"></div>
    <div class="content">
      <div class="icon-chip">
        <svg width="140" height="140" viewBox="0 0 108 108">
          <path d="M39,37 H69 A7,7 0 0 1 76,44 V63 A7,7 0 0 1 69,70 H39 A7,7 0 0 1 32,63 V44 A7,7 0 0 1 39,37 Z"
            fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M34.5,41 L54,56 L73.5,41"
            fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="text">
        <p class="title">Tapiz Mail</p>
        <p class="subtitle">Jedan inbox za sve tvoje naloge</p>
      </div>
    </div>
  </div>
</body>
</html>
